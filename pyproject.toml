[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "websearch-mcp"
version = "2.0.0"
description = "Keyless web-search and page-fetch MCP server"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
encoding = ["charset-normalizer>=3.0"]
dev = ["pytest>=8.0"]

[project.scripts]
websearch-mcp = "websearch.server:run"

[tool.setuptools]
packages = ["websearch", "websearch.engines"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits the real network"]
